[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cei-labs-agent"
version = "0.1.0"
description = "CEI Labs Agent — a lightweight, infrastructure-independent CTF training-wheels AI teammate for absolute beginners."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CEI Labs" }]
keywords = ["ctf", "agent", "ollama", "bandit", "training", "cybersecurity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Education",
]

dependencies = [
    "pydantic>=2",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "paramiko",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Judgernaut777/CEI-Labs-Agent"
Repository = "https://github.com/Judgernaut777/CEI-Labs-Agent"

[project.scripts]
ctf-agent = "cei_labs_agent.cli:main"
ctf-agent-verify = "cei_labs_agent.verify:main"

# --- Build configuration (src layout) -------------------------------------

[tool.hatch.build]
# The importable package lives under src/, not at the project root.
sources = ["src"]

[tool.hatch.build.targets.wheel]
# Ship exactly the one package. hatchling includes non-Python files that live
# inside the package tree, but we force-include the static assets below to make
# the intent explicit and robust against any auto-detection quirks.
packages = ["src/cei_labs_agent"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the single-page web UI (HTML/CSS/JS) as package data so FileResponse
# can serve it from the installed wheel.
"src/cei_labs_agent/static" = "cei_labs_agent/static"

[tool.hatch.build.targets.sdist]
# Keep the source distribution lean but complete: the package, tests and docs.
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/TROUBLESHOOTING.md",
    "/bootstrap.sh",
    "/bootstrap.ps1",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
