[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cei-labs-agent"
version = "0.1.0"
description = "CEI Labs Agent — a lightweight, infrastructure-independent CTF training-wheels AI teammate for absolute beginners."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CEI Labs" }]
keywords = ["ctf", "agent", "ollama", "bandit", "training", "cybersecurity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Education",
]

dependencies = [
    "pydantic>=2",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "paramiko",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Judgernaut777/CEI-Labs-Agent"
Repository = "https://github.com/Judgernaut777/CEI-Labs-Agent"

[project.scripts]
ctf-agent = "cei_labs_agent.cli:main"
ctf-agent-verify = "cei_labs_agent.verify:main"

# --- Build configuration (src layout) -------------------------------------

[tool.hatch.build]
# The importable package lives under src/, not at the project root.
sources = ["src"]

[tool.hatch.build.targets.wheel]
# Ship exactly the one package. hatchling also bundles the non-Python files
# that live inside the package tree (the static web UI under
# cei_labs_agent/static/), which is exactly what we want.
packages = ["src/cei_labs_agent"]

# NOTE: no force-include for src/cei_labs_agent/static -- `packages` above
# already bundles every file inside the package tree (including the static
# web UI assets), and force-including them a second time makes hatchling
# abort with "A second file is being added to the wheel archive at the same
# path". The wheel must contain cei_labs_agent/static/* exactly once.

[tool.hatch.build.targets.sdist]
# Keep the source distribution lean but complete: the package, tests and docs.
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/TROUBLESHOOTING.md",
    "/bootstrap.sh",
    "/bootstrap.ps1",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
