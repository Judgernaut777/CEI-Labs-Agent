<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Lost — CEI Labs</title>
<meta name="description" content="This path doesn't exist on the range.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#070B0E;--bg-1:#0C1319;--line:#1C2831;--text-1:#E8F0F2;--text-2:#93A6AE;--acc:#E8F0F2}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background:
    linear-gradient(rgba(28,40,49,.30) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(28,40,49,.30) 1px,transparent 1px) 0 0/48px 48px,
    var(--bg-0);
  color:var(--text-1);font-family:"IBM Plex Mono",ui-monospace,monospace;
}
.banner{background:var(--acc);color:var(--bg-0);font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;text-align:center;padding:5px 12px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:0}
.kicker{font-size:12px;letter-spacing:.18em;color:var(--text-2);text-transform:uppercase}
h1{font-family:"Chakra Petch",system-ui,sans-serif;font-weight:700;font-size:clamp(90px,20vw,180px);line-height:1;margin:18px 0 10px;color:transparent;-webkit-text-stroke:1.5px rgba(232,240,242,.55)}
p{color:var(--text-2);font-size:14px}
a.cta{display:inline-block;margin-top:34px;font-size:12px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;color:var(--text-1);border:1px solid var(--acc);padding:12px 22px}
a.cta:hover{background:rgba(232,240,242,.08)}
a.cta:focus-visible{outline:1px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<div class="banner">CEI-LABS // SIGNAL LOST</div>
<main>
  <div class="kicker">CEI-LABS // SIGNAL LOST</div>
  <h1>404</h1>
  <p>This path doesn't exist on the range.</p>
  <a class="cta" href="/">RETURN TO COMMAND</a>
</main>
<div class="banner">CEI-LABS // SIGNAL LOST</div>
</body>
</html>
